  /3.2/{API_KEY}/{CONTROL_SUM}/decode/value-list/enum/enum_model.{format}:
    get:
      operationId: Enum_Model
      tags:
      - Enums
      summary: Model
      description: This endpoint offers a comprehensive list of vehicle models accessible through the VIN Decoder API. Each entry in the response contains a unique identifier (id) and the corresponding model name (value). It includes both standardized and non-standardized values to accommodate a wide range of vehicle models, from common passenger cars to more specialized types of vehicles.
      parameters:
      - name: API_KEY
        in: path
        description: Your API key
        required: true
        schema:
          type: string
      - name: CONTROL_SUM
        in: path
        description: 'The CONTROL_SUM for this endpoint is generated by taking the first 10 characters of the SHA1 hash of your VIN, the operation ID ''<strong>value-list-enum_model</strong>'', API key, and secret key, concatenated in that order.<br/> <i>For instance</i>: <code>$controlSum = substr(sha1("{$vin}|value-list-enum_model|{$apiKey}|{$secretKey}"), 0, 10);</code><br/> For a complete guide, please refer to the <a href="https://vincario.com/api-docs/3.2/#api-how-to-create-a-request">How to create a request</a>.

          '
        required: true
        schema:
          type: string
      - name: format
        in: path
        description: Response format (json or html)
        required: true
        style: simple
        schema:
          type: string
          default: json
      responses:
        '200':
          description: 'Returns an object in which each key-value pair represents a specific vehicle model. The key (<strong>id</strong>) serves as a unique identifier for each model, while the associated value (<strong>value</strong>) provides the name of the model. This format enables straightforward integration and utilization in applications requiring detailed vehicle model categorization or identification.

