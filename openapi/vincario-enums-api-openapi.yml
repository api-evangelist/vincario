  /3.2/{API_KEY}/{CONTROL_SUM}/decode/value-list/enum/enum_make_model.{format}:
    get:
      operationId: Enum_Vehicle
      tags:
      - Enums
      summary: Vehicle
      description: This endpoint retrieves a list of vehicle makes and models from the VIN Decoder API, where each entry is represented by a combination of make and model information. The data includes a unique identifier (vehicle_id) for each vehicle, along with identifiers for the make (make_id) and model (model_id), and the textual representations of the make (make) and model (model). This endpoint is essential for applications requiring a detailed enumeration of vehicle options, facilitating user selection and data analysis across a diverse range of automotive brands and models.
      parameters:
      - name: API_KEY
        in: path
        description: Your API key
        required: true
        schema:
          type: string
