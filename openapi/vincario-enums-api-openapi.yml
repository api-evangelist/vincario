      - name: CONTROL_SUM
        in: path
        description: 'The CONTROL_SUM for this endpoint is generated by taking the first 10 characters of the SHA1 hash of your VIN, the operation ID ''<strong>value-list-enum_transmission</strong>'', API key, and secret key, concatenated in that order.<br/> <i>For instance</i>: <code>$controlSum = substr(sha1("{$vin}|value-list-enum_transmission|{$apiKey}|{$secretKey}"), 0, 10);</code><br/> For a complete guide, please refer to the <a href="https://vincario.com/api-docs/3.2/#api-how-to-create-a-request">How to create a request</a>.

          '
        required: true
        schema:
          type: string
      - name: format
        in: path
        description: Response format (json or html)
        required: true
        style: simple
        schema:
          type: string
          default: json
      responses:
        '200':
          description: 'Returns an object in which each key-value pair represents a specific type of vehicle transmission. The key (<strong>id</strong>) serves as a unique identifier for each transmission type, while the associated value (<strong>value</strong>) describes the transmission''s mechanism. This structured format facilitates the accurate categorization and identification of transmission types, enhancing the detail and utility of vehicle data for automotive databases, user selections, and technical analyses.

            '
          content:
            application/json:
              schema:
                description: "<pre>{\n  <span>\"key\"</span>:  {\n    <span>\"id\"</span>: <b>integer</b>\n    <span>\"value\"</span>: <i>string</i>\n  }\n}</pre>\n"
              examples:
                Success response:
                  value: '{"0":{"id":0,"value":"Non-standardized value"},"1":{"id":1,"value":"Automated Manual Transmission (AMT)"},"2":{"id":2,"value":"Automatic"},"3":{"id":3,"value":"Continuously Variable Transmission (CVT)"},"4":{"id":4,"value":"Dual-clutch Transmission (DCT)"},"5":{"id":5,"value":"Electronic Continuously Variable (e-CVT)"},"6":{"id":6,"value":"Manual/Standard"},"7":{"id":7,"value":"Motorcycle - Chain Drive"},"9":{"id":9,"value":"Motorcycle - CVT Belt Drive"},"10":{"id":10,"value":"Motorcycle - Shaft Drive"},"12":{"id":12,"value":"Sequential Manual Transmission"}}'
                When you use an incorrect API key:
                  value: '{"error":true,"message":"Unknown API Key"}'
                When you use an incorrect control sum:
                  value: '{"error":true,"message":"Invalid Control sum"}'
                When you reach a limit of requests per minute:
                  value: '{"error":true,"message":"You''ve reached limit of 60 requests per minute. Contact us at info@vincario.com for a customized limit."}'
        '404':
          description: The route could not be found.
        '500':
          description: Unexpected internal errors.
