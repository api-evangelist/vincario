  /3.2/{API_KEY}/{CONTROL_SUM}/decode/value-list/enum/enum_make.{format}:
    get:
      operationId: Enum_Make
      tags:
      - Enums
      summary: Make
      description: This endpoint provides a detailed list of vehicle manufacturers available in the VIN Decoder API. Each entry includes an id and a value, where the id is a unique identifier for the manufacturer, and the value is the name of the manufacturer. The list encompasses a wide range of vehicle manufacturers from global automotive brands to specialized vehicle producers, offering comprehensive coverage for various vehicle identification and categorization needs.
      parameters:
      - name: API_KEY
        in: path
        description: Your API key
        required: true
        schema:
          type: string
      - name: CONTROL_SUM
        in: path
        description: 'The CONTROL_SUM for this endpoint is generated by taking the first 10 characters of the SHA1 hash of your VIN, the operation ID ''<strong>value-list-enum_make</strong>'', API key, and secret key, concatenated in that order.<br/> <i>For instance</i>: <code>$controlSum = substr(sha1("{$vin}|value-list-enum_make|{$apiKey}|{$secretKey}"), 0, 10);</code><br/> For a complete guide, please refer to the <a href="https://vincario.com/api-docs/3.2/#api-how-to-create-a-request">How to create a request</a>.

          '
        required: true
        schema:
          type: string
      - name: format
        in: path
        description: Response format (json or html)
        required: true
        style: simple
        schema:
          type: string
          default: json
      responses:
        '200':
          description: 'Returns an object where each key-value pair corresponds to a specific vehicle manufacturer. The key (<strong>id</strong>) serves as a unique identifier for each manufacturer, and the associated value (<strong>value</strong>) provides the manufacturer''s name. This response format facilitates easy access to a wide array of manufacturers, ranging from well-known automotive brands to niche vehicle makers, ensuring versatile application in vehicle data analysis and user interfaces.

            '
          content:
            application/json:
              schema:
                description: "<pre>{\n  <span>\"key\"</span>:  {\n    <span>\"id\"</span>: <b>integer</b>\n    <span>\"value\"</span>: <i>string</i>\n  }\n}</pre>\n"
