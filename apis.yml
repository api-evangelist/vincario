name: Vincario
kind: company
description: Vincario (vincario.com, formerly vindecoder.eu) provides a REST API, currently version 3.2, that
  decodes a Vehicle Identification Number (VIN) into a vehicle specification and provides OEM VIN lookup, OEM
  service history, vehicle market value, stolen-vehicle checks, value lists (enums) for makes, models and other
  attributes, and the account credit balance. Requests are authenticated with an API key plus a control sum in the
  URL path. Vincario also runs a public MCP server (com.vincario/vehicle-data) and offers VIN OCR scanning and UK
  license plate lookup services, whose APIs are not yet publicly documented.
