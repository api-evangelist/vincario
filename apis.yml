x-correction-request:
  requested: '2026-10-06'
  source:
  - https://github.com/api-evangelist/vincario/issues/1
  request: 'Issue #1 (JakubJachym, Vincario): base domain changed from vindecoder.eu to vincario.com; main API docs https://vincario.com/api-docs/
    (redirects to the latest version, 3.2) replace https://vindecoder.eu/api; per-API documentation and landing URLs for VIN Decode Info, VIN
    Decode, OEM VIN Lookup, OEM Service History, Vehicle Market Value, Stolen Check, Credit Balance and the enum endpoints; public MCP server
    https://mcp.vincario.com/mcp (com.vincario/vehicle-data, github.com/Vincario/MCP-vincario); VIN OCR scanner and UK license plate lookup.'
  applied: '2026-10-06'
  applied_note: 'Verified live 2026-10-06: vincario.com, /api-docs/ (redirects to /api-docs/3.2/), every landing page in the issue, the MCP repo
    and the blog feed answer 200; an invented path 404s. The 3.2 docs page declares its spec route api-docs/openapi/3.2, which serves
    text/yaml (OpenAPI 3.0.1, "VIN Decoder" 3.2, server https://api.vincario.com/, 16 operations) - saved byte-identical as
    openapi/_original/vincario-openapi.yml, replacing the vindecoder.eu-era document, then split by tag (7 APIs) and standardized; the 5 old
    per-tag files and their aids (account, decode, market-value, vehicle-info) are gone, stolen-check kept. MCP: initialize + tools/list
    answered anonymously (Vincario VIN Tools 1.28.1; vin_decode, vin_decode_info, stolen_check, vehicle_market_value) - recorded in
    mcp/vincario-mcp.yml. VIN OCR and license plate lookup recorded as product pages only (no public API docs yet). The issue''s per-operation
    doc URLs are hash anchors on one page, so they are recorded as given, not probed individually. Derived Postman/OpenCollection collections
    built from the old documents were removed; they regenerate from the new split on the next pipeline run.'
